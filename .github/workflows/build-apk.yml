name: Build LanPilot v2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract complete LanPilot source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f LanPilot-Android-v2.0-Source.zip || { echo 'Missing LanPilot-Android-v2.0-Source.zip at repository root'; exit 1; }
          unzip -o -q LanPilot-Android-v2.0-Source.zip -d .
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/java/com/example/lanpilot/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanPilot-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
